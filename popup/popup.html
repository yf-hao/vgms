<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VGMS填报助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="title-row">
        <h1 hidden>VGMS填报助手</h1>
        <button id="mode-switch" class="icon-button" type="button"></button>
      </header>
      <p id="mode-hint" class="privacy-note" hidden></p>
      <nav class="tabs" role="tablist" aria-label="功能">
        <button
          id="tab-login"
          class="tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-login"
          tabindex="0">登录</button>
        <button
          id="tab-subject"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-subject"
          tabindex="-1">课题</button>
        <button
          id="tab-topic"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-topic"
          tabindex="-1">选题</button>
        <button
          id="tab-taskbook"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-taskbook"
          tabindex="-1">任务书</button>
      </nav>
      <section id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <label for="login-school">学校</label>
        <input id="login-school" type="text" autocomplete="organization" placeholder="请输入学校名称">
        <label for="login-account">账号</label>
        <input id="login-account" type="text" autocomplete="username" placeholder="请输入登录账号">
        <label for="login-password">密码</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入登录密码">
        <button id="save-login" type="button">保存登录信息</button>
        <p id="login-status" role="status" aria-live="polite"></p>
        <p class="privacy-note">信息保存在此浏览器的扩展本地存储中；登录页会自动填入并勾选协议，但不会自动提交。</p>
      </section>
      <section
        id="panel-subject"
        role="tabpanel"
        aria-labelledby="tab-subject"
        hidden>
        <div id="template-picker" class="template-picker">
          <button
            id="template-picker-button"
            class="secondary template-picker-button"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="template-picker-menu">导入 Markdown 模板</button>
          <div id="template-picker-menu" class="template-picker-menu" role="menu" hidden>
            <button id="import-single" type="button" role="menuitem">导入单个模板</button>
            <button id="import-folder" type="button" role="menuitem">导入文件夹（批量）</button>
          </div>
        </div>
        <input
          id="template-file"
          type="file"
          accept=".md,text/markdown,text/plain"
          hidden>
        <input
          id="template-folder"
          type="file"
          webkitdirectory
          directory
          multiple
          accept=".md,text/markdown"
          hidden>
        <label for="form-data">申报信息</label>
        <textarea
          id="form-data"
          rows="11"
          spellcheck="false"
          placeholder="计算机科学与技术专业&#10;计算机科学与技术专业&#10;基于Spring Boot&#10;自选课题&#10;工程实践&#10;理科&#10;这个项目的选题背景是xxx，主要内容是XXX"></textarea>
        <div class="actions">
          <button id="save" type="button">保存并等待填表</button>
          <button id="cancel" class="secondary" type="button">取消等待</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section
        id="panel-topic"
        role="tabpanel"
        aria-labelledby="tab-topic"
        hidden>
        <label for="topic-comment">审核意见</label>
        <textarea
          id="topic-comment"
          rows="5"
          spellcheck="false"
          placeholder="输入一次，后续所有选题审核都使用同一意见"></textarea>
        <div class="actions">
          <button id="topic-start" type="button">保存并等待审核</button>
          <button id="topic-stop" class="secondary" type="button">停止填写</button>
        </div>
        <p id="topic-status" role="status" aria-live="polite"></p>
      </section>
      <section
        id="panel-taskbook"
        role="tabpanel"
        aria-labelledby="tab-taskbook"
        hidden>
        <div class="template-picker">
          <button id="taskbook-import" class="secondary template-picker-button" type="button">导入 Markdown 模板</button>
        </div>
        <input id="taskbook-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
        <label for="taskbook-text">任务书内容</label>
        <textarea
          id="taskbook-text"
          rows="11"
          spellcheck="false"
          placeholder="导入模板，或直接输入 / 粘贴任务书 Markdown：&#10;# 研究（设计）目的与任务&#10;# 基本要求&#10;# 进度安排（表格：序号 | 起止日期 | 任务）&#10;# 提交时间"></textarea>
        <div class="actions">
          <button id="taskbook-start" type="button">保存并等待填表</button>
          <button id="taskbook-cancel" class="secondary" type="button">取消等待</button>
        </div>
        <p id="taskbook-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="panel-mode.js"></script>
    <script src="../shared/topic-review-settings.js"></script>
    <script src="topic-popup.js"></script>
    <script src="taskbook-parser.js"></script>
    <script src="../shared/taskbook-store.js"></script>
    <script src="taskbook-popup.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
